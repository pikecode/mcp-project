[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-knowledge-base"
version = "0.1.0"
description = "本地 Markdown 知识库 MCP Server"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.2.0",
]

[tool.setuptools]
py-modules = ["server", "http_server"]
package-dir = {"" = "src"}